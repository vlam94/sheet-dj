name: installer

# Builds the Windows installer. Run it by hand (the file is then an artifact of the run), or push a
# version tag such as v0.1.0, which also publishes it as a GitHub Release: a plain download link.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - name: Install Inno Setup when the image does not have it
        shell: pwsh
        run: |
          $installed = (Get-Command iscc -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $installed) { choco install innosetup -y --no-progress }
      - name: Build (PyInstaller, smoke test of the built program, Inno Setup)
        shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sheet-dj-setup
          path: build/installer/sheet-dj-setup-*.exe
          if-no-files-found: error
      - name: Publish a release with the installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem build/installer/sheet-dj-setup-*.exe
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $setup --clobber
          } else {
            gh release create "${{ github.ref_name }}" $setup --title "Sheet DJ ${{ github.ref_name }}" --notes "Download sheet-dj-setup-*.exe, double-click it, then use the Sheet DJ icon on your Desktop."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
