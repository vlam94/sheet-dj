name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false # a Windows-only failure must not hide the Linux result, or the reverse
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Tests again with no UTF-8 default (finds code that relies on one)
        if: runner.os == 'Linux'
        env:
          PYTHONUTF8: "0"
          LC_ALL: C
        run: pytest
