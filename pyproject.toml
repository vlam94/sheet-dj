[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sheet-dj"
version = "0.1.0"
description = "Build a set list from band scores and export one score plus the tuba lines."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "music21>=9.1",
    "pathvalidate>=3.2",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]
e2e = ["pytest-playwright>=0.5"]

[project.scripts]
sheet-dj-server = "sheet_dj.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sheet_dj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not e2e'"
markers = ["e2e: browser tests, need the e2e extra and `playwright install`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["music21", "music21.*"]
ignore_missing_imports = true
